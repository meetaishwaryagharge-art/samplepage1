<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BroadCast Pro Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins,sans-serif;background:#f1f5f4}
[data-bs-theme=dark] body{background:#0f1716}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#075e54,#25d366)}
.side{position:fixed;top:0;left:0;bottom:0;width:230px;background:linear-gradient(180deg,#075e54,#128c7e);color:#fff;padding:18px 12px;overflow:auto;z-index:20}
.brand{font-weight:700;font-size:1.2rem;margin:0 8px 20px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:#ffffffcc;border:0;background:none;width:100%;text-align:left;margin-bottom:3px;font-size:.9rem}
.nv.on,.nv:hover{background:#ffffff26;color:#fff}
main{margin-left:230px;padding:22px}
.card{border:0;border-radius:18px;box-shadow:0 4px 16px #0000000f}
.stat{border-radius:18px;padding:16px;color:#fff}.stat b{font-size:1.9rem;display:block}
.g1{background:linear-gradient(135deg,#6a11cb,#2575fc)}.g2{background:linear-gradient(135deg,#11998e,#38ef7d)}.g3{background:linear-gradient(135deg,#ee0979,#ff6a00)}.g4{background:linear-gradient(135deg,#f7971e,#d9a400)}
.btn-wa{background:linear-gradient(135deg,#128c7e,#25d366);color:#fff;border:0;border-radius:12px}.btn-wa:hover{color:#fff;filter:brightness(1.08)}
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.phone{width:280px;margin:auto;border:9px solid #1c1c1e;border-radius:34px;overflow:hidden;background:#e5ddd5}
.ph-h{background:#075e54;color:#fff;padding:10px;font-size:.8rem}
.ph-b{min-height:280px;padding:12px;background-image:radial-gradient(#00000012 1.5px,transparent 1.5px);background-size:16px 16px}
.bub{background:#dcf8c6;color:#222;border-radius:12px 12px 0 12px;padding:8px 12px;font-size:.8rem;white-space:pre-wrap;margin-left:auto;max-width:92%}
.bub small{display:block;text-align:right;color:#888;font-size:.62rem}
.mail{background:#fff;color:#222;border-radius:10px;padding:10px;font-size:.78rem;margin-top:10px;white-space:pre-wrap}
.tag{cursor:pointer}
@media(max-width:850px){.side{position:static;width:auto;display:flex;overflow-x:auto;padding:8px}.brand{display:none}main{margin:0;padding:12px}.nv{width:auto;white-space:nowrap;margin:0 3px 0 0}}
</style>
</head>
<body>

<div id="login" class="login"><div class="card p-4" style="width:340px">
  <div class="text-center mb-3"><div class="av mx-auto mb-2" style="width:64px;height:64px;font-size:1.8rem;background:linear-gradient(135deg,#128c7e,#25d366)"><i class="bi bi-megaphone-fill"></i></div><h4 class="fw-bold mb-0">BroadCast Pro</h4><small class="text-muted">Admin Login</small></div>
  <input id="lu" class="form-control mb-2" placeholder="Username" value="admin">
  <input id="lp" type="password" class="form-control mb-2" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <div id="le" class="text-danger small mb-2"></div>
  <button class="btn btn-wa w-100 py-2" onclick="doLogin()">Login</button>
  <small class="text-muted text-center mt-3">Demo: admin / admin123</small>
</div></div>

<div id="app" class="d-none">
 <aside class="side">
  <div class="brand"><i class="bi bi-megaphone-fill"></i> BroadCast Pro</div>
  <div id="nav"></div>
  <button class="nv mt-2" onclick="document.documentElement.dataset.bsTheme=document.documentElement.dataset.bsTheme=='dark'?'light':'dark'"><i class="bi bi-moon-stars"></i> Dark mode</button>
  <button class="nv" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</button>
 </aside>
 <main id="main"></main>
</div>

<div class="modal fade" id="mod"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:20px"><div class="modal-body p-4"><h5 class="fw-bold mb-3" id="mt"></h5><div id="mb"></div><button class="btn btn-wa w-100 py-2 mt-3" id="ms">Save</button></div></div></div></div>
<div class="toast-container position-fixed top-0 end-0 p-3"><div id="toast" class="toast text-bg-dark"><div class="toast-body" id="tb"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=['Festival','Notice','Announcement','Monthly Update'];
let D={clients:[],groups:['Premium'],camps:[],runs:[],
 tpls:[{id:1,name:'Diwali Wishes',type:'Festival',msg:'🪔 Happy Diwali, {name}!\nMay the festival of lights bring joy and prosperity to you and {company}. Thank you for your trust!'},
 {id:2,name:'Holiday Notice',type:'Notice',msg:'📢 Notice for {name}\nOur office will remain closed on [date]. Services resume on [date].'},
 {id:3,name:'New Offer',type:'Announcement',msg:'✨ Hello {name}!\nWe are happy to announce [offer]. Valid till [date]. Reply to know more.'},
 {id:4,name:'Monthly Update',type:'Monthly Update',msg:'📅 Monthly Update for {company}\nHi {name}, here is this month\'s update: [details]. Thank you for being with us!'}],
 set:{biz:'My Business',cc:'91',user:'admin',pass:'admin123',api:'',waId:'',waTok:'',smtp:'',from:''}};
try{const s=JSON.parse(localStorage.getItem('bcpro')||'null');if(s)D=s}catch(e){}
const save=()=>{try{localStorage.setItem('bcpro',JSON.stringify(D))}catch(e){}};
const toast=t=>{$('tb').textContent=t;bootstrap.Toast.getOrCreateInstance($('toast'),{delay:2500}).show()};
const grads=['#667eea,#764ba2','#f093fb,#f5576c','#4facfe,#00c6fb','#43e97b,#38f9d7','#fa709a,#fee140','#ff9a44,#fc6076'];
const av=n=>`<span class="av" style="background:linear-gradient(135deg,${grads[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%6]})">${E((n[0]||'?').toUpperCase())}</span>`;
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const pn=p=>{let d=String(p||'').replace(/\D/g,'');return d.length===10?D.set.cc+d:d};
const field=(id,l,v='',t='text')=>`<label class="small text-muted">${l}</label><input id="${id}" type="${t}" class="form-control mb-2" value="${E(v)}">`;
const groupsAll=()=>['All',...D.groups];
const recips=g=>D.clients.filter(c=>g==='All'||c.group===g);
const fill=(m,c)=>m.replace(/{name}/g,c.name).replace(/{company}/g,c.company||'your company');

/* login */
function doLogin(){if($('lu').value===D.set.user&&$('lp').value===D.set.pass){sessionStorage.in=1;start()}else $('le').textContent='Wrong username or password'}
function logout(){sessionStorage.clear();location.reload()}
function start(){$('login').classList.add('d-none');$('app').classList.remove('d-none');go('dash')}
if(sessionStorage.in)start();

/* nav */
const PAGES=[['dash','speedometer2','Dashboard'],['clients','people','Clients'],['groups','collection','Groups'],['compose','send','Create Announcement'],['tpls','file-earmark-text','Templates'],['sched','calendar-event','Scheduled'],['hist','clock-history','Campaign History'],['rep','bar-chart-line','Delivery Reports'],['set','gear','Settings']];
let cur='dash',cf='All',repId=null;
function go(p){cur=p;$('nav').innerHTML=PAGES.map(x=>`<button class="nv ${x[0]===p?'on':''}" onclick="go('${x[0]}')"><i class="bi bi-${x[1]}"></i> ${x[2]}</button>`).join('');$('main').innerHTML=R[p]();(A[p]||(()=>{}))();scrollTo(0,0)}

/* modal */
function modal(t,b,fn){$('mt').textContent=t;$('mb').innerHTML=b;$('ms').onclick=()=>{if(fn()!==false)bootstrap.Modal.getInstance($('mod')).hide()};new bootstrap.Modal($('mod')).show()}

/* sending engine */
const pick=()=>{const r=Math.random();return r<.6?'Delivered':r<.85?'Read':r<.95?'Sent':'Failed'};
async function runCamp(c){
 const rc=recips(c.group),rep=rc.map(x=>({n:x.name,m:x.mobile,e:x.email,wa:c.ch.includes('wa')&&x.mobile?pick():'-',em:c.ch.includes('em')&&x.email?(Math.random()<.92?'Delivered':'Failed'):'-'}));
 if(D.set.api){try{await fetch(D.set.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campaign:c,recipients:rc})})}catch(e){toast('Backend API not reachable')}}
 D.runs.unshift({id:Date.now()+Math.random(),name:c.name,type:c.type,msg:c.msg,ch:c.ch,group:c.group,t:Date.now(),rep});save();return rep.length}
setInterval(async()=>{let ch=0;for(const c of D.camps){if(c.when<=Date.now()){await runCamp(c);ch=1;if(c.repeat==='monthly'){const d=new Date(c.when);do{d.setMonth(d.getMonth()+1)}while(d<=Date.now());c.when=d.getTime()}else c.done=1}}
 if(ch){D.camps=D.camps.filter(c=>!c.done);save();toast('Scheduled campaign sent 🚀');if(['dash','sched','hist','rep'].includes(cur))go(cur)}},15000);

/* pages */
const R={},A={};
R.dash=()=>{const L=D.runs.flatMap(r=>r.rep),ok=L.filter(x=>['Delivered','Read'].includes(x.wa)||x.em==='Delivered').length,fail=L.filter(x=>x.wa==='Failed'||x.em==='Failed').length;
 return `<h4 class="fw-bold mb-3">Dashboard</h4><div class="row g-3 mb-3">
 <div class="col-6 col-lg-3"><div class="stat g1"><b>${D.clients.length}</b>Clients</div></div>
 <div class="col-6 col-lg-3"><div class="stat g2"><b>${D.runs.length}</b>Campaigns sent</div></div>
 <div class="col-6 col-lg-3"><div class="stat g4"><b>${D.camps.length}</b>Scheduled</div></div>
 <div class="col-6 col-lg-3"><div class="stat g3"><b>${ok}<small class="fs-6"> / ${fail} failed</small></b>Delivered</div></div></div>
 <div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h6 class="fw-bold">Upcoming</h6>${D.camps.map(c=>`<div class="border-bottom py-2"><b>${E(c.name)}</b> <span class="badge bg-secondary">${c.repeat==='monthly'?'Monthly':'Once'}</span><br><small class="text-muted">${fmt(c.when)} · ${E(c.group)}</small></div>`).join('')||'<p class="text-muted mb-0">Nothing scheduled</p>'}</div></div>
 <div class="col-lg-6"><div class="card p-3"><h6 class="fw-bold">Recent campaigns</h6>${D.runs.slice(0,5).map(r=>`<div class="border-bottom py-2"><b>${E(r.name)}</b> <small class="text-muted">${fmt(r.t)} · ${r.rep.length} clients</small></div>`).join('')||'<p class="text-muted mb-0">No campaigns yet</p>'}</div></div></div>
 <button class="btn btn-wa mt-3 px-4" onclick="go('compose')"><i class="bi bi-send-fill"></i> New Announcement</button>`};

R.clients=()=>`<div class="d-flex flex-wrap gap-2 justify-content-between mb-3"><h4 class="fw-bold mb-0">Clients <small class="text-muted fs-6">${D.clients.length}/100</small></h4>
 <div class="d-flex gap-2"><label class="btn btn-outline-secondary btn-sm"><i class="bi bi-upload"></i> Import Excel/CSV<input type="file" hidden accept=".csv,.xlsx,.xls" onchange="imp(this)"></label><button class="btn btn-wa btn-sm px-3" onclick="editC()"><i class="bi bi-plus-lg"></i> Add</button></div></div>
 <div class="card p-3"><div class="row g-2 mb-2"><div class="col-8"><input id="q" class="form-control" placeholder="Search..." oninput="tbl()"></div><div class="col-4"><select id="gf" class="form-select" onchange="tbl()">${groupsAll().map(g=>`<option>${E(g)}</option>`).join('')}</select></div></div>
 <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Company</th><th>Group</th><th></th></tr></thead><tbody id="tb2"></tbody></table></div>
 <small class="text-muted">Import columns: name, mobile, email, company, group</small></div>`;
A.clients=()=>tbl();
function tbl(){const q=$('q').value.toLowerCase(),g=$('gf').value;
 $('tb2').innerHTML=D.clients.filter(c=>(g==='All'||c.group===g)&&Object.values(c).join(' ').toLowerCase().includes(q)).map(c=>`<tr><td>${av(c.name)} ${E(c.name)}</td><td>${E(c.mobile)}</td><td>${E(c.email)}</td><td>${E(c.company)}</td><td>${c.group?`<span class="badge bg-success">${E(c.group)}</span>`:'-'}</td>
 <td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="editC(${c.id})"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" onclick="delC(${c.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-muted py-4">No clients found</td></tr>'}
function editC(id){const c=D.clients.find(x=>x.id===id)||{};
 modal(id?'Edit client':'Add client',field('fn','Name',c.name)+field('fm','Mobile (WhatsApp)',c.mobile)+field('fe','Email',c.email,'email')+field('fc','Company',c.company)+`<label class="small text-muted">Group</label><select id="fg" class="form-select"><option value="">None</option>${D.groups.map(g=>`<option ${c.group===g?'selected':''}>${E(g)}</option>`).join('')}</select>`,()=>{
  const n=$('fn').value.trim();if(!n||(!$('fm').value&&!$('fe').value)){toast('Enter name and mobile or email');return false}
  if(!id&&D.clients.length>=100){toast('Limit 100 clients');return false}
  const o={id:id||Date.now()+Math.random(),name:n,mobile:$('fm').value.trim(),email:$('fe').value.trim(),company:$('fc').value.trim(),group:$('fg').value};
  id?Object.assign(c,o):D.clients.push(o);save();go('clients');toast('Saved ✅')})}
function delC(id){if(confirm('Delete client?')){D.clients=D.clients.filter(c=>c.id!==id);save();go('clients')}}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let n=0;
 rows.forEach(o=>{const k={};Object.keys(o).forEach(x=>k[x.toLowerCase().trim()]=String(o[x]).trim());const name=k.name;if(!name||D.clients.length>=100)return;
 const g=k.group||'';if(g&&g!=='All'&&!D.groups.includes(g))D.groups.push(g);
 D.clients.push({id:Date.now()+Math.random(),name,mobile:k.mobile||k.phone||'',email:k.email||'',company:k.company||'',group:g==='All'?'':g});n++});
 save();go('clients');toast(n+' clients imported')}catch(e){toast('Could not read file')}};r.readAsArrayBuffer(f)}

R.groups=()=>`<div class="d-flex justify-content-between mb-3"><h4 class="fw-bold mb-0">Client Groups</h4><button class="btn btn-wa btn-sm px-3" onclick="addG()"><i class="bi bi-plus-lg"></i> Custom group</button></div><div class="row g-3">
 ${groupsAll().map(g=>`<div class="col-md-4"><div class="card p-3"><div class="d-flex justify-content-between align-items-center"><div><h6 class="fw-bold mb-0">${g==='Premium'?'⭐ ':g==='All'?'👥 ':'📁 '}${E(g==='All'?'All Clients':g==='Premium'?'Premium Clients':g)}</h6><small class="text-muted">${recips(g).length} clients</small></div>
 ${g==='All'||g==='Premium'?'':`<button class="btn btn-sm btn-outline-danger" onclick="delG('${E(g)}')"><i class="bi bi-trash"></i></button>`}</div></div></div>`).join('')}</div>`;
function addG(){modal('New group',field('gn','Group name'),()=>{const n=$('gn').value.trim();if(!n||groupsAll().includes(n)){toast('Enter a unique name');return false}D.groups.push(n);save();go('groups')})}
function delG(g){if(confirm('Delete group? Clients stay but become ungrouped.')){D.groups=D.groups.filter(x=>x!==g);D.clients.forEach(c=>{if(c.group===g)c.group=''});save();go('groups')}}

R.compose=()=>`<h4 class="fw-bold mb-3">Create Announcement</h4><div class="row g-3"><div class="col-lg-7"><div class="card p-3">
 <div class="row g-2 mb-2"><div class="col-6"><label class="small text-muted">Type</label><select id="ct" class="form-select" onchange="tplOpts()">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
 <div class="col-6"><label class="small text-muted">Template</label><select id="ctp" class="form-select" onchange="useTpl()"></select></div></div>
 ${field('cn','Campaign name')}${field('cs','Email subject')}
 <label class="small text-muted">Message ({name} and {company} are replaced per client)</label><textarea id="cm" rows="6" class="form-control mb-2" oninput="pv()"></textarea>
 <div class="row g-2 mb-2"><div class="col-6"><label class="small text-muted">Send to</label><select id="cg" class="form-select" onchange="pv()">${groupsAll().map(g=>`<option>${E(g)}</option>`).join('')}</select></div>
 <div class="col-6"><label class="small text-muted d-block">Channels</label><div class="form-check form-check-inline mt-2"><input class="form-check-input" type="checkbox" id="cwa" checked onchange="pv()"><label class="form-check-label" for="cwa">WhatsApp</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="cem" onchange="pv()"><label class="form-check-label" for="cem">Email</label></div></div></div>
 <div class="row g-2 mb-3"><div class="col-6"><label class="small text-muted">When</label><select id="cw" class="form-select" onchange="$('sc').classList.toggle('d-none',this.value=='now')"><option value="now">Send now</option><option value="later">Schedule</option></select></div>
 <div class="col-6 d-none" id="sc"><label class="small text-muted">Date & time</label><input type="datetime-local" id="cd" class="form-control mb-1"><select id="cr" class="form-select"><option value="none">One time</option><option value="monthly">Repeat every month (auto)</option></select></div></div>
 <button class="btn btn-wa py-2" onclick="goCamp()"><i class="bi bi-send-fill"></i> Go</button></div></div>
 <div class="col-lg-5"><div class="phone"><div class="ph-h"><b>${E(D.set.biz)}</b><br><small>Live preview</small></div><div class="ph-b"><div class="bub"><span id="pvm"></span><small>now ✓✓</small></div><div class="mail" id="pve"></div></div></div><p class="text-center small text-muted mt-2" id="pvc"></p></div></div>`;
A.compose=()=>{tplOpts();pv()};
function tplOpts(){const t=$('ct').value;$('ctp').innerHTML='<option value="">— blank —</option>'+D.tpls.filter(x=>x.type===t).map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}
function useTpl(){const t=D.tpls.find(x=>x.id==$('ctp').value);if(t){$('cm').value=t.msg;$('cn').value=t.name;$('cs').value=t.name}pv()}
function pv(){const s=D.clients[0]||{name:'Rahul',company:'ABC Traders'};$('pvm').textContent=fill($('cm').value||'Your message appears here',s);
 $('pve').style.display=$('cem').checked?'block':'none';$('pve').textContent='✉ '+($('cs').value||'Subject')+'\n\n'+fill($('cm').value,s);
 $('pvc').textContent=recips($('cg').value).length+' recipients'}
async function goCamp(){const ch=[$('cwa').checked&&'wa',$('cem').checked&&'em'].filter(Boolean),c={id:Date.now(),name:$('cn').value.trim()||$('ct').value,type:$('ct').value,msg:$('cm').value.trim(),subj:$('cs').value,ch,group:$('cg').value,repeat:$('cr').value};
 if(!c.msg||!ch.length)return toast('Write a message and pick WhatsApp or Email');if(!recips(c.group).length)return toast('This group has no clients');
 if($('cw').value==='now'){const n=await runCamp(c);toast('Sent to '+n+' clients 🎉');go('hist')}
 else{if(!$('cd').value)return toast('Pick date & time');c.when=new Date($('cd').value).getTime();D.camps.push(c);save();toast('Scheduled ✅');go('sched')}}

R.tpls=()=>`<div class="d-flex justify-content-between mb-3"><h4 class="fw-bold mb-0">Message Templates</h4><button class="btn btn-wa btn-sm px-3" onclick="editT()"><i class="bi bi-plus-lg"></i> New</button></div><div class="row g-3">
 ${D.tpls.map(t=>`<div class="col-md-6"><div class="card p-3 h-100"><div class="d-flex justify-content-between"><b>${E(t.name)}</b><span class="badge bg-success">${t.type}</span></div><p class="small my-2" style="white-space:pre-wrap">${E(t.msg)}</p><div class="mt-auto"><button class="btn btn-sm btn-outline-primary" onclick="editT(${t.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="D.tpls=D.tpls.filter(x=>x.id!=${t.id});save();go('tpls')">Delete</button></div></div></div>`).join('')}</div>`;
function editT(id){const t=D.tpls.find(x=>x.id===id)||{};modal(id?'Edit template':'New template',field('tn','Name',t.name)+`<label class="small text-muted">Type</label><select id="tt" class="form-select mb-2">${TYPES.map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select><label class="small text-muted">Message</label><textarea id="tm" rows="5" class="form-control">${E(t.msg)}</textarea>`,()=>{
 const o={id:id||Date.now(),name:$('tn').value.trim(),type:$('tt').value,msg:$('tm').value.trim()};if(!o.name||!o.msg){toast('Fill all fields');return false}id?Object.assign(t,o):D.tpls.push(o);save();go('tpls')})}

R.sched=()=>`<h4 class="fw-bold mb-3">Scheduled & Automatic Campaigns</h4><div class="card p-3">${D.camps.map(c=>`<div class="d-flex justify-content-between align-items-center border-bottom py-2 flex-wrap gap-2"><div><b>${E(c.name)}</b> <span class="badge bg-${c.repeat==='monthly'?'warning text-dark':'secondary'}">${c.repeat==='monthly'?'🔁 Monthly auto':'Once'}</span><br><small class="text-muted">Next: ${fmt(c.when)} · ${E(c.group)} · ${c.ch.join('+').toUpperCase()}</small></div>
 <div><button class="btn btn-sm btn-wa" onclick="runNow(${c.id})">Run now</button> <button class="btn btn-sm btn-outline-danger" onclick="D.camps=D.camps.filter(x=>x.id!=${c.id});save();go('sched')">Cancel</button></div></div>`).join('')||'<p class="text-muted text-center py-4 mb-0">📅 Nothing scheduled. Choose "Schedule" and "Repeat every month" in Create Announcement.</p>'}
 <small class="text-muted mt-3">Scheduler checks every 15 seconds while this page is open. A real server uses a cron job instead.</small></div>`;
async function runNow(id){await runCamp(D.camps.find(c=>c.id===id));toast('Sent');go('hist')}

R.hist=()=>`<h4 class="fw-bold mb-3">Campaign History</h4><div class="card p-3">${D.runs.map(r=>`<div class="border-bottom py-2"><b>${E(r.name)}</b> <span class="badge bg-info text-dark">${r.type}</span> ${r.ch.map(x=>`<span class="badge bg-${x=='wa'?'success':'primary'}">${x=='wa'?'WhatsApp':'Email'}</span>`).join(' ')}<br><small class="text-muted">${fmt(r.t)} · ${E(r.group)} · ${r.rep.length} clients</small> <a href="#" onclick="repId=${r.id};go('rep');return false">View report</a><div class="small mt-1 text-muted" style="white-space:pre-wrap">${E(r.msg.slice(0,140))}</div></div>`).join('')||'<p class="text-muted text-center py-4 mb-0">📭 No campaigns yet</p>'}</div>`;

R.rep=()=>{const r=D.runs.find(x=>x.id===repId)||D.runs[0];if(!r)return '<h4 class="fw-bold mb-3">Delivery Reports</h4><div class="card p-4 text-center text-muted">No reports yet</div>';
 const cnt=k=>r.rep.filter(x=>x.wa===k||x.em===k).length,col={Delivered:'success',Read:'info',Sent:'secondary',Failed:'danger','-':'light text-muted'};
 return `<h4 class="fw-bold mb-3">Delivery Reports</h4><select class="form-select mb-3" onchange="repId=+this.value;go('rep')">${D.runs.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${E(x.name)} — ${fmt(x.t)}</option>`).join('')}</select>
 <div class="row g-2 mb-3">${['Delivered','Read','Sent','Failed'].map(k=>`<div class="col-6 col-md-3"><div class="card p-3 text-center"><b class="fs-4">${cnt(k)}</b><small class="text-${col[k].split(' ')[0]}">${k}</small></div></div>`).join('')}</div>
 <div class="card p-3"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Client</th><th>WhatsApp</th><th>Email</th></tr></thead><tbody>${r.rep.map(x=>`<tr><td>${E(x.n)}</td><td><span class="badge bg-${col[x.wa]}">${x.wa}</span></td><td><span class="badge bg-${col[x.em]}">${x.em}</span></td></tr>`).join('')}</tbody></table></div>
 <small class="text-muted">Demo statuses are simulated. With the real backend these come from WhatsApp Cloud API webhooks and SMTP/email API logs.</small></div>`};

R.set=()=>`<h4 class="fw-bold mb-3">Settings</h4><div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h6 class="fw-bold">General & Admin</h6>${field('s1','Business name',D.set.biz)}${field('s2','Default country code',D.set.cc)}${field('s3','Admin username',D.set.user)}${field('s4','Admin password',D.set.pass,'password')}</div></div>
 <div class="col-lg-6"><div class="card p-3"><h6 class="fw-bold">Integrations (Backend)</h6>${field('s5','Backend API URL (POST /send)',D.set.api)}${field('s6','WhatsApp Phone Number ID',D.set.waId)}${field('s7','WhatsApp Cloud API token',D.set.waTok,'password')}${field('s8','SMTP host / email API',D.set.smtp)}${field('s9','From email',D.set.from)}
 <small class="text-muted">Keep real tokens on your server (.env), not in the browser. These fields are for the demo.</small></div></div></div>
 <button class="btn btn-wa mt-3 px-4" onclick="saveS()">Save settings</button> <button class="btn btn-outline-danger mt-3" onclick="if(confirm('Erase ALL data?')){localStorage.removeItem('bcpro');logout()}">Reset all data</button>`;
function saveS(){const s=D.set;s.biz=$('s1').value;s.cc=$('s2').value;s.user=$('s3').value;s.pass=$('s4').value;s.api=$('s5').value;s.waId=$('s6').value;s.waTok=$('s7').value;s.smtp=$('s8').value;s.from=$('s9').value;save();toast('Settings saved ✅')}
</script>
</body>
</html>
